upstream django_app {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    # Dynamic application traffic routed to Gunicorn
    location / {
        proxy_pass http://django_app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;

        # Stream the RAG response straight through, token by token.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Static files served directly by Nginx for speed
    location /static/ {
        alias /app/staticfiles/;
    }

    # Media files (if your app allows file uploads)
    location /media/ {
        alias /app/media/;
    }
}
