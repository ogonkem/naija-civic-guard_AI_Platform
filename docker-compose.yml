# Naija Civic Guard - full containerised stack.
#
# Ollama and any hosted LLM (Groq/OpenAI) stay OUTSIDE Docker. Containers reach
# the host's Ollama via host.docker.internal (Docker Desktop provides it).
#
#   cp .env.example .env   # fill in GROQ_API_KEY etc.
#   docker compose up --build
#
# First boot: the gateway runs migrations and, with AUTO_INGEST=1, ingests the
# constitution PDF into the ChromaDB service before serving.

services:
  # --- data stores ---------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-civicguard}
      POSTGRES_USER: ${POSTGRES_USER:-civicguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicguard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host by default (some Windows port ranges are
    # reserved). Use `docker compose exec postgres psql ...`, or add a mapping.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-civicguard} -d ${POSTGRES_DB:-civicguard}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  chromadb:
    image: chromadb/chroma:1.0.15
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chromadata:/data
    ports:
      - "${CHROMA_HOST_PORT:-8001}:8000"

  # --- app services ------------------------------------------------------
  mcp:
    build:
      context: .
      dockerfile: docker/mcp.Dockerfile
    environment:
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      MCP_TRANSPORT: streamable-http
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8100"
    ports:
      - "${MCP_HOST_PORT:-8100}:8100"
    depends_on:
      chromadb:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    env_file: [.env]
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,gateway"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-civicguard}
      POSTGRES_USER: ${POSTGRES_USER:-civicguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicguard}
      REDIS_URL: redis://redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      MCP_SERVER_URL: http://mcp:8100/mcp
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.2}
      AUTO_INGEST: "1"
    ports:
      - "${GATEWAY_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_started
      mcp:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    command: celery -A civic_guard worker -Q eval -l info --pool=threads --concurrency=4
    env_file: [.env]
    environment:
      DJANGO_DEBUG: "false"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-civicguard}
      POSTGRES_USER: ${POSTGRES_USER:-civicguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicguard}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      WORKER_METRICS_PORT: "9540"
    ports:
      - "${WORKER_METRICS_HOST_PORT:-9540}:9540"   # Prometheus scrape target
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_started

  # --- analytics: dbt models over the Postgres logs (opt-in) -----------
  # docker compose --profile analytics run --rm dbt build
  dbt:
    profiles: ["analytics"]
    build:
      context: .
      dockerfile: docker/dbt.Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-civicguard}
      POSTGRES_USER: ${POSTGRES_USER:-civicguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-civicguard}
    depends_on:
      postgres:
        condition: service_healthy

  # --- observability (Prometheus + Grafana) ---------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_USERS_DEFAULT_THEME: "light"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  chromadata:
  promdata:
  grafanadata:
