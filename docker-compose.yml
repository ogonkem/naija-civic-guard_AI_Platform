version: '3.8'

services:
  web:
    build: .
    volumes:
      - .:/app
      - chroma_data:/app/chroma_db  # Persists your vector store
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - OLLAMA_BASE_URL=http://ollama:11434

  nginx:
    image: nginx:1.25-alpine
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    ports:
      - "80:80"                        # Public web traffic enters here
    depends_on:
      - web

volumes:
  chroma_data:
  static_volume:
